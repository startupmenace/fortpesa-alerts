<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Donation Alerts</title>
<style>
  html, body {
    margin: 0; 
    height: 100%; 
    width: 100%; 
    background: transparent; 
    overflow: hidden; 
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #alert {
    position: fixed;
    left: 0; top: 0; bottom: 0; right: 0;
    min-width: initial; max-width: initial; padding: 40px;
    background: linear-gradient(135deg, #00a651, #006b34);
    color: #fff; 
    text-align: center;
    z-index: 9999;
  }
  #title { font-size: 48px; font-weight: 800; }
  #title b { color: #ffe36e; }
  #msg { font-size: 32px; margin-top: 12px; word-wrap: break-word; }
</style>
</head>
<body>
<div id="alert">
  <div id="title"></div>
  <div id="msg"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const tts = params.get('tts') !== '0';           // add ?tts=0 to disable voice
const minTts = Number(params.get('minTts') || 50); // only read messages >= this amount
const DURATION = Number(params.get('duration') || 8000);

const el = document.getElementById('alert');
const queue = [];
let busy = false;
let lastTs = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
      o.start(ctx.currentTime + i * 0.1); o.stop(ctx.currentTime + i * 0.1 + 0.3);
    });
  } catch (e) {}
}

function next() {
  if (busy || !queue.length) return;
  busy = true;
  const d = queue.shift();
  document.getElementById('title').innerHTML = `<b>${esc(d.name)}</b> donated ${esc(d.currency)} ${d.amount.toLocaleString()}!`;
  document.getElementById('msg').textContent = d.message || '';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 100);
  chime();
  try {
    if (tts && d.message && d.amount >= minTts && 'speechSynthesis' in window) {
      speechSynthesis.speak(new SpeechSynthesisUtterance(`${d.name} says: ${d.message}`));
    }
  } catch (e) {}
  setTimeout(() => {
    queue.length > 0 ? next() : el.style.display = 'none';
  }, DURATION);
}

async function poll() {
  try {
    const r = await fetch(`/api/alerts?token=${encodeURIComponent(token)}&since=${lastTs}`);
    const d = await r.json();
    if (d.alerts && d.alerts.length) {
      d.alerts.reverse().forEach(a => queue.push(a));
      if (d.serverTime) lastTs = d.serverTime;
      el.style.display = 'block';
      next();
    }
  } catch (e) { /* poll failed, retry next tick */ }
  setTimeout(poll, 2000);
}

poll();
</script>
</body>
</html>
