<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fortpesa Donation - OBS Widget</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%; background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif;
  }
  #widget { width: 100%; height: 100%; position: relative; }
  #titleArea { position: absolute; width: 100%; text-align: center; pointer-events: none; }
  #donorName { font-size: 36px; font-weight: bold; color: #ffe36e; margin-bottom: 8px; }
  #donationAmount { font-size: 48px; color: #00a651; }
  #message { font-size: 24px; color: #aaa; margin-top: 4px; word-wrap: break-word; max-width: 90%; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
<div id="widget">
  <div id="titleArea">
    <div id="donorName"></div>
    <div id="donationAmount"></div>
    <div id="message"></div>
  </div>
  <script>
 // Configuration - customize these for your stream
 const CONFIG = {
   canvasWidth: 800,
   canvasHeight: 450,
   particleCount: 30,
   burstColor: '#ffe36e',
   bgColor: '#0a0a0f',
   fadeOutSpeed: 8000,
   minAmountForBurst: 1
 };

 // Canvas setup
 const canvas = document.getElementById('burstCanvas');
 const ctx = canvas.getContext('2d');
 canvas.width = CONFIG.canvasWidth;
 canvas.height = CONFIG.canvasHeight;

 // Resize canvas to fill widget
 function resizeCanvas() {
   const rect = document.getElementById('widget').getBoundingClientRect();
   canvas.width = rect.width;
   canvas.height = rect.height;
 }
 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

// Particle class
class Particle {
   constructor(x, y) {
     this.reset(x, y);
   }
   reset(x, y) {
     this.x = x;
     this.y = y;
     this.shape = Math.floor(Math.random() * 3);
     this.size = Math.random() * 4 + 2;
     this.color = CONFIG.burstColor;
     const angle = Math.random() * Math.PI * 2;
     const velocity = Math.random() * 15 + 5;
     this.vx = Math.cos(angle) * velocity;
     this.vy = Math.sin(angle) * velocity;
     this.gravity = 0.3;
     this.friction = 0.99;
     this.opacity = 1;
     this.decay = Math.random() * 0.002 + 0.001;
   }
   update() {
     this.vy += this.gravity;
     this.vx *= this.friction;
     this.vy *= this.friction;
     this.x += this.vx;
     this.y += this.vy;
     this.opacity -= this.decay;
   }
   draw() {
     if (this.opacity <= 0) return;
     ctx.save();
     ctx.globalAlpha = Math.max(0, this.opacity);
     ctx.fillStyle = this.color;
     ctx.translate(this.x, this.y);
     
     if (this.shape === 0) {
       ctx.beginPath();
       for (let i = 0; i < 5; i++) {
         const radius = (i % 2 === 0) ? this.size : this.size / 2;
         const angle = (i * Math.PI / 5) - Math.PI / 2;
         ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
       }
       ctx.closePath();
       ctx.fill();
     } else if (this.shape === 1) {
       ctx.beginPath();
       const r = this.size * Math.max(0, this.opacity);
       ctx.arc(0, 0, r, 0, Math.PI * 2);
       ctx.fill();
     } else {
       ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
     }
     ctx.restore();
   }
}

// Animation state
let particles = [];
let animationId = null;
let isAnimating = false;

// Trigger particle burst at given position
function triggerBurst(x, y, donorName, amount, message) {
   if (isAnimating && particles.length > 20) return;

   isAnimating = true;
   particles = [];

   const centerX = x || canvas.width / 2;
   const centerY = y || canvas.height / 2;

   for (let i = 0; i < CONFIG.particleCount; i++) {
     particles.push(new Particle(centerX, centerY));
   }

   // Show donor text
   document.getElementById('donorName').textContent = donorName || 'Anonymous';
   document.getElementById('donationAmount').textContent = amount.toLocaleString() + ' KES';
   document.getElementById('message').textContent = message || 'Thank you!';
   document.getElementById('titleArea').style.opacity = '1';

   // Start animation loop
   if (!animationId) {
     animationId = requestAnimationFrame(updateLoop);
   }
 }

 // Animation loop
 function updateLoop() {
   ctx.fillStyle = CONFIG.bgColor;
   ctx.fillRect(0, 0, canvas.width, canvas.height);
   
   particles = particles.filter(p => p.opacity > 0 && p.y < canvas.height + 100);
   
   particles.forEach(p => {
     p.update();
     p.draw();
   });

   // Continue loop if there are particles
   if (particles.length > 0) {
     animationId = requestAnimationFrame(updateLoop);
   } else {
     endAnimation();
   }
 }

// End animation and hide
 function endAnimation() {
   cancelAnimationFrame(animationId);
   animationId = null;
   isAnimating = false;
   document.getElementById('titleArea').style.opacity = '0';
   setTimeout(() => { particles = []; }, 200);
 }

// Polling for alerts
 const params = new URLSearchParams(location.search);
 const token = params.get('token') || '';
 let lastTs = 0;
 let alertQueue = [];

 function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

 async function poll() {
   try {
     const r = await fetch(`/api/alerts?token=${encodeURIComponent(token)}&since=${lastTs}`);
     const d = await r.json();
     if (d.alerts && d.alerts.length) {
       d.alerts.reverse().forEach(a => {
         const amount = Math.max(CONFIG.minAmountForBurst, parseInt(a.amount) || 1);
         alertQueue.push({ name: a.name, amount, message: a.message || '' });
       });
       if (d.serverTime) lastTs = d.serverTime;
       launchNextAlert();
     }
   } catch (e) { /* poll failed, retry */ }
   setTimeout(poll, 2000);
 }

 function launchNextAlert() {
   if (alertQueue.length === 0) return;
   const alert = alertQueue.shift();
   const donorY = canvas.height * 0.8;
   triggerBurst(
     canvas.width / 2,
     donorY,
     alert.name,
     alert.amount,
     alert.message
   );
   setTimeout(launchNextAlert, CONFIG.fadeOutSpeed + 500);
 }

 poll();
